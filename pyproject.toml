[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rotamap"
dynamic = ["version"]
description = "Mapas de rotas por município e apresentação PowerPoint interativa, para qualquer UF."
requires-python = ">=3.11"
authors = [{ name = "Gabriel Azevedo" }]
keywords = ["mapas", "rotas", "ibge", "geopandas", "powerpoint", "logistica"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pandas>=2.1",
    "geopandas>=0.14",
    "matplotlib>=3.8",
    "python-pptx>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pre-commit>=3.7",
]

[project.scripts]
rotamap = "rotamap.cli:app"

[tool.hatch.version]
path = "src/rotamap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rotamap"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PTH", # pathlib em vez de os.path
    "T20", # sem print
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["rotamap"]
branch = true
